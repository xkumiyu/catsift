[tools]
go = "1.27"
golangci-lint = "2.13.2"
node = "24"
npm = "11"

[env]
_.path = "{{config_root}}/bin"

[tasks.build]
description = "Build the CLI"
run = "go build -o ./bin/catsift ./cmd/catsift"

[tasks.test]
description = "Run race-enabled tests"
run = "go test -race ./..."

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.fmt-check]
description = "Check Go formatting"
run = "test -z \"$(gofmt -l .)\""

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.npm-test]
description = "Run npm wrapper tests"
run = "npm test --prefix npm"

[tasks.npm-pack-check]
description = "Validate npm package contents"
run = "npm pack ./npm --dry-run --ignore-scripts"

[tasks.npm-stage-publish]
description = "Build and stage the npm package for publishing"
tools.goreleaser = "2"
usage = '''
arg "<version>" help="Release version to stage (for example, 0.3.0)"
'''
run = '''
set -eu

version="${usage_version?}"
release_tag="$(git describe --tags --exact-match HEAD)"
test "$release_tag" = "v$version"
test ! -e dist
test ! -L dist
test -z "$(find npm/bin -maxdepth 1 -type f -name 'catsift-bin-*' -print -quit)"

temp_dir="$(mktemp -d)"
cp npm/package.json "$temp_dir/package.json"
cleanup() {
  cp "$temp_dir/package.json" npm/package.json
  find npm/bin -maxdepth 1 -type f -name 'catsift-bin-*' -delete
  rm -rf -- "$temp_dir" dist
}
trap cleanup EXIT

goreleaser release --clean --skip=publish
npm pkg set version="$version" --prefix npm
node .github/scripts/stage-npm-binaries.js "$version"
npm stage publish ./npm
'''

[tasks.release-check]
description = "Check GoReleaser configuration"
tools.goreleaser = "2"
run = "goreleaser check"

[tasks.check]
description = "Run local project checks"
depends = [
  "fmt-check",
  "lint",
  "vet",
  "test",
  "npm-test",
  "npm-pack-check",
  "build",
]
