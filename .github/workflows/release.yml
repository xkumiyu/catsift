name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  GOTOOLCHAIN: local

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.manual_release_tag.outputs.tag || steps.pushed_release_tag.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate and create release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: manual_release_tag
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu

          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || {
            echo "Run this workflow from the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          }

          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No existing release tag was found." >&2
            exit 1
          fi

          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Latest tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          case "$RELEASE_BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Version component must be major, minor, or patch." >&2
              exit 1
              ;;
          esac

          version="$major.$minor.$patch"
          tag="v$version"
          if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Use pushed release tag
        if: ${{ github.event_name == 'push' }}
        id: pushed_release_tag
        run: echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@11.19.1

      - name: Set npm package version
        working-directory: npm
        run: npm pkg set version="${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

      - name: Stage native binaries for npm package
        run: node .github/scripts/stage-npm-binaries.js "${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

      # Staged publish only: Trusted Publisher allows stage, not direct publish. Human approves later.
      - name: Stage npm package for publishing
        run: npm stage publish ./npm
